kind = "web"
previewPath = "/"
title = "Math Animation Engine"
description = "An interactive math animation studio for writing equations, previewing dynamic 2D and 3D visualizations, and creating polished mathematical scenes for learning and presentation."
version = "1.0.0"
id = "artifacts/math-animation-engine"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21154

[services.development]
run = "pnpm --filter @workspace/math-animation-engine run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/math-animation-engine", "run", "build" ]
serve = "static"
publicDir = "artifacts/math-animation-engine/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21154"
BASE_PATH = "/"
