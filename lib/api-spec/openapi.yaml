openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: validation
    description: Mathematical expression validation
  - name: feedback
    description: Landing page suggestions and bug reports
  - name: studio-content
    description: Developer-managed shared Studio text
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /validate:
    post:
      operationId: validateEquation
      tags: [validation]
      summary: Validate a mathematical equation
      description: Parses and classifies a mathematical expression without browser scraping.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquationValidationInput"
      responses:
        "200":
          description: Structured validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EquationValidationResult"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /feedback:
    get:
      operationId: listFeedback
      tags: [feedback]
      summary: List community feedback
      description: Returns the latest suggestions and bug reports shared on the landing page.
      responses:
        "200":
          description: Community feedback entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Feedback"
        "503":
          description: Feedback storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /studio-content:
    get:
      operationId: listStudioContent
      tags: [studio-content]
      summary: List shared Studio text overrides
      description: Returns developer-managed text overrides used by the Studio.
      responses:
        "200":
          description: Shared Studio text overrides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudioContent"
        "503":
          description: Studio content storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateStudioContent
      tags: [studio-content]
      summary: Update shared Studio text
      description: Updates one shared Studio text node using developer credentials.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudioContentUpdate"
      responses:
        "200":
          description: Updated shared Studio text
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudioContent"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Developer credentials are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Studio content storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createFeedback
      tags: [feedback]
      summary: Submit community feedback
      description: Stores a named suggestion or bug report.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackInput"
      responses:
        "201":
          description: Stored feedback entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Feedback"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Feedback storage is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    EquationValidationInput:
      type: object
      properties:
        equation:
          type: string
          minLength: 1
        mode:
          type: string
          enum: [auto, function, parametric, implicit, implicit3d, polar, vector, piecewise, points]
      required:
        - equation
        - mode
    EquationValidationResult:
      type: object
      properties:
        valid:
          type: boolean
        mode:
          type: string
          enum: [function, parametric, implicit, implicit3d, polar, vector, piecewise, points]
        animatable:
          type: boolean
        hasTimeVariable:
          type: boolean
        supports2dFallback:
          type: boolean
        verificationStatus:
          type: string
          enum: [invalid, static, animatable]
        verificationMessage:
          type: string
        normalized:
          type: ["string", "null"]
        error:
          type: ["string", "null"]
        suggestions:
          type: array
          items:
            type: string
        variables:
          type: array
          items:
            type: string
      required:
        - valid
        - mode
        - animatable
        - hasTimeVariable
        - supports2dFallback
        - verificationStatus
        - verificationMessage
        - normalized
        - error
        - suggestions
        - variables
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Feedback:
      type: object
      properties:
        id:
          type: number
          format: int32
        name:
          type: string
        timestamp:
          type: string
          format: date-time
        category:
          type: string
          enum: [bug, suggestion]
        content:
          type: string
      required:
        - id
        - name
        - timestamp
        - category
        - content
    FeedbackInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        category:
          type: string
          enum: [bug, suggestion]
        content:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - name
        - category
        - content
    StudioContent:
      type: object
      properties:
        key:
          type: string
        text:
          type: string
        updatedAt:
          type: string
          format: date-time
      required:
        - key
        - text
        - updatedAt
    StudioContentUpdate:
      type: object
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 500
        text:
          type: string
          maxLength: 2000
        developerEmail:
          type: string
          minLength: 1
        developerPassword:
          type: string
          minLength: 1
      required:
        - key
        - text
        - developerEmail
        - developerPassword

